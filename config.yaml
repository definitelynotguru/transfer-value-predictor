data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  artifact_dir: artifacts

# Q1: competition identity, verified against competitions.csv at ingest.
competition:
  code: premier-league
  ids: [GB1]
  games_per_season: 380

# Q2: upstream parses Transfermarkt fee strings as: '-'/'?'/'' -> null, 'free transfer' -> 0,
# '€…' -> amount, anything else (loan transfer, End of loan, Loan fee: €X, …) -> 0.
# So a positive fee is a paid permanent move; 0 and null are ambiguous and excluded.
fees:
  currency: EUR
  encoding: positive_is_paid_permanent

study:
  # Source seasons available for lookback (2012 = 2012/13).
  source_seasons: [2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  # Transfer cycles in the study window. Cycle s starts the day after season s-1's last match.
  season_ids: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  transfer_start: 2014-05-12
  transfer_end_exclusive: 2026-05-25
  min_minutes: 90
  include_cards: false
  position_policy: historical_then_proxy
  prediction_as_of: 2026-05-25

# Q3: T = start of the 2024 cycle (day after the 2023/24 season's last match, 2024-05-19).
split:
  test_start: 2024-05-20
  min_total_rows: 200
  min_test_rows: 40

cv:
  n_folds: 3
  min_train_rows: 80
  min_validation_rows: 20

runtime:
  random_state: 42
  bootstrap_replicates: 5000
  bootstrap_seed: 42
  bootstrap_confidence: 0.95
