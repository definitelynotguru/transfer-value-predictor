[project]
name = "transfer-value"
version = "0.1.0"
description = "Methodology study: how wrong is a linear fee model for PL-active players' reported transfer fees?"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Parth Dubey" }]
dependencies = [
    "pandas==3.0.6",
    "numpy==2.4.6",
    "scikit-learn==1.9.1",
    "matplotlib==3.11.2",
    "joblib==1.6.0",
    "typer==0.27.2",
    "pyyaml==6.0.3",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[project.scripts]
tvp = "transfer_value.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transfer_value"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["transfer_value", "conftest", "fixtures"]
